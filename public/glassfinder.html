<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Glass Finder - Screen Protector Compatibility</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-blue: #2563eb;
      --primary-blue-light: #3b82f6;
      --primary-blue-dark: #1d4ed8;
      --accent-cyan: #06b6d4;
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --text-muted: rgba(255, 255, 255, 0.5);
      --success: #10b981;
      --error: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0a0a 0%, #0f172a 25%, #1e293b 50%, #0f172a 75%, #0a0a0a 100%) !important;
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite, oilEffect 20s ease-in-out infinite;
      color: var(--text-primary) !important;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(37, 99, 235, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(6, 182, 212, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(30, 58, 138, 0.1) 0%, transparent 70%) !important;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes oilEffect {
      0%, 100% {
        filter: hue-rotate(0deg) brightness(1);
      }
      25% {
        filter: hue-rotate(5deg) brightness(1.02);
      }
      50% {
        filter: hue-rotate(-5deg) brightness(1);
      }
      75% {
        filter: hue-rotate(3deg) brightness(1.01);
      }
    }

    .container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    .glass-card {
      background: var(--glass-bg) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border-radius: 24px;
      border: 1px solid var(--glass-border) !important;
      box-shadow: var(--glass-shadow) !important;
      padding: 3rem;
      max-width: 540px;
      width: 100%;
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.6s ease-out;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%, rgba(255,255,255,0.05) 100%) !important;
      border-radius: 24px;
      z-index: -1;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .title {
      font-size: 2.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      background-clip: text !important;
      letter-spacing: -0.02em;
      text-align: center;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-secondary) !important;
      text-align: center;
      margin-bottom: 2rem;
      font-weight: 400;
    }

    .search-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .search-input-wrapper {
      position: relative;
      width: 100%;
    }

    .autocomplete-ghost {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 1rem 1.25rem;
      font-size: 1rem;
      font-family: inherit;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: normal;
      color: rgba(255, 255, 255, 0.35) !important;
      background: transparent !important;
      border: 1px solid transparent !important;
      border-radius: 12px;
      pointer-events: none;
      overflow: hidden;
      white-space: pre;
      text-align: left;
      direction: ltr;
      z-index: 0;
      box-sizing: border-box;
    }

    .search-input {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 1rem 1.25rem;
      font-size: 1rem;
      font-family: inherit;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: normal;
      background: rgba(255, 255, 255, 0.04) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 12px;
      color: var(--text-primary) !important;
      outline: none;
      transition: all 0.3s ease;
      box-sizing: border-box;
      text-align: left;
      direction: ltr;
    }

    .search-input::placeholder {
      color: var(--text-muted) !important;
    }

    .search-input:focus {
      background: rgba(255, 255, 255, 0.06) !important;
      border-color: var(--primary-blue) !important;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2) !important;
    }

    .search-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 1rem 1.5rem;
      font-size: 1.05rem;
      font-weight: 600;
      font-family: inherit;
      background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-blue-light) 50%, var(--accent-cyan) 100%) !important;
      background-size: 200% 200%;
      border: none !important;
      border-radius: 12px;
      color: white !important;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3) !important;
    }

    .search-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4) !important;
      background-position: 100% 100%;
    }

    .search-button:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.3) !important;
    }

    .search-icon {
      flex-shrink: 0;
    }

    .results-container {
      min-height: 100px;
    }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
      color: var(--text-secondary) !important;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1) !important;
      border-top-color: var(--primary-blue) !important;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .message-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding: 2rem;
      text-align: center;
      background: rgba(255, 255, 255, 0.03) !important;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
    }

    .message-card.error {
      background: rgba(239, 68, 68, 0.08) !important;
      border-color: rgba(239, 68, 68, 0.2) !important;
    }

    .message-icon {
      color: var(--text-muted) !important;
    }

    .message-card.error .message-icon {
      color: var(--error) !important;
    }

    .message-card p {
      color: var(--text-secondary) !important;
      font-size: 0.95rem;
    }

    .message-card .sub-message {
      color: var(--text-muted) !important;
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }

    .result-header {
      margin-bottom: 1.25rem;
    }

    .result-header h3 {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-primary) !important;
      margin-bottom: 0.25rem;
    }

    .result-header .highlight {
      background: linear-gradient(135deg, var(--primary-blue-light) 0%, var(--accent-cyan) 100%) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      background-clip: text !important;
    }

    .result-count {
      font-size: 0.9rem;
      color: var(--text-muted) !important;
    }

    .result-card {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      padding: 1rem 1.25rem;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 12px;
      transition: all 0.3s ease;
      animation: slideIn 0.4s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .result-card:hover {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.15) 0%, rgba(6, 182, 212, 0.1) 100%) !important;
      border-color: rgba(59, 130, 246, 0.3) !important;
      transform: translateX(5px);
    }

    .checkmark {
      color: var(--success) !important;
      flex-shrink: 0;
    }

    .compatible-models {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-primary) !important;
      line-height: 1.5;
    }

    @media (max-width: 768px) {
      .container {
        padding: 1rem;
      }

      .glass-card {
        padding: 2rem 1.5rem;
        max-width: 100%;
        border-radius: 20px;
      }

      .glass-card::before {
        border-radius: 20px;
      }

      .results-container {
        min-height: 60px;
      }

      .title {
        font-size: 2rem;
      }

      .subtitle {
        font-size: 0.9rem;
      }

      .search-input,
      .search-button {
        padding: 0.875rem 1rem;
        font-size: 0.95rem;
      }

      .autocomplete-ghost {
        padding: 0.875rem 1rem;
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .result-card {
        padding: 0.875rem 1rem;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 0.5rem;
      }

      .glass-card {
        padding: 1.25rem 1rem 1rem;
        border-radius: 16px;
      }

      .glass-card::before {
        border-radius: 16px;
      }

      .results-container {
        min-height: 40px;
      }

      .search-container {
        gap: 0.625rem;
        margin-bottom: 1rem;
      }

      .message-card {
        padding: 1.25rem 1rem;
      }

      .loading {
        padding: 1.25rem;
      }

      .title {
        font-size: 1.75rem;
      }

      .subtitle {
        font-size: 0.85rem;
        margin-bottom: 1.5rem;
      }

      .search-container {
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }

      .search-input,
      .search-button {
        padding: 0.75rem 0.875rem;
        font-size: 0.9rem;
      }

      .autocomplete-ghost {
        padding: 0.75rem 0.875rem;
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .result-card {
        padding: 0.75rem 0.875rem;
        gap: 0.625rem;
      }

      .compatible-models {
        font-size: 0.9rem;
      }

      .result-header h3 {
        font-size: 1rem;
      }

      .message-card {
        padding: 1.5rem 1rem;
      }
    }

  </style>
</head>
<body>
  <div class="container">
    <div class="glass-card">
      <h1 class="title">Glass Finder</h1>
      <p class="subtitle">با یه کلیک گلس مشابه رو پیدا کن</p>

      <div class="search-container">
        <div class="search-input-wrapper">
          <div id="ghostText" class="autocomplete-ghost"></div>
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="مدل گوشی را وارد کنید... (مثلاً A15)"
            autocomplete="off"
          >
        </div>
        <button id="searchBtn" class="search-button">
          <span>جستجو</span>
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
        </button>
      </div>

      <div id="results" class="results-container"></div>
    </div>
  </div>

  <script>
    // Compatibility data directly embedded
    const compatibilityGroups = [
      { id: 1,  models: ['iPhone 5', 'iPhone 5S', 'iPhone SE'] },
      { id: 2,  models: ['iPhone 6', 'iPhone 6S', 'iPhone 7', 'iPhone 8', 'iPhone SE 2', 'iPhone SE 3'] },
      { id: 3,  models: ['iPhone 6 Plus', 'iPhone 6S Plus'] },
      { id: 4,  models: ['iPhone 7', 'iPhone 8'] },
      { id: 5,  models: ['iPhone 7 Plus', 'iPhone 8 Plus'] },
      { id: 6,  models: ['iPhone X', 'iPhone XS', 'iPhone 11 Pro'] },
      { id: 7,  models: ['iPhone XR', 'iPhone 11'] },
      { id: 8,  models: ['iPhone XS Max', 'iPhone 11 Pro Max'] },
      { id: 9,  models: ['iPhone 12', 'iPhone 12 Pro'] },
      { id: 10, models: ['iPhone 12 Pro Max'] },
      { id: 11, models: ['iPhone 13 Mini'] },
      { id: 12, models: ['iPhone 13', 'iPhone 13 Pro', 'iPhone 14'] },
      { id: 13, models: ['iPhone 13 Pro Max', 'iPhone 14 Plus'] },
      { id: 14, models: ['iPhone 14 Pro'] },
      { id: 15, models: ['iPhone 14 Pro Max'] },
      { id: 16, models: ['iPhone 15', 'iPhone 16 6.1'] },
      { id: 17, models: ['iPhone 15 Plus', 'iPhone 16 Plus 6.7'] },
      { id: 18, models: ['iPhone 15 Pro 6.1'] },
      { id: 19, models: ['iPhone 15 Pro Max'] },
      { id: 20, models: ['iPhone 16 Pro', 'iPhone 17'] },
      { id: 21, models: ['iPhone 16 Pro Max'] },
      { id: 22, models: ['iPhone 17 Pro'] },
      { id: 23, models: ['iPhone 17 Air'] },
      { id: 24, models: ['iPhone 17 Pro Max'] },
      { id: 25, models: ['A05', 'A06', 'A07', 'REDMI 13C', 'REDMI 13R', 'POCO C65', 'POCO M6'] },
      { id: 26, models: ['A05S', 'POCO C51', 'POCO C55', 'M14 4G'] },
      { id: 27, models: ['A10S', 'M10', 'M20', 'A10', 'M10S'] },
      { id: 28, models: ['A11', 'REDMI NOTE 9', 'REDMI 11 LITE', 'REDMI 12 LITE', 'M11'] },
      { id: 29, models: ['A12', 'A13', 'A23', 'A32 5G', 'A70', 'A70S', 'A42', 'A02', 'A02S', 'A03', 'A03S', 'A03 CORE', 'A04', 'A04S', 'A04 CORE', 'M02 4G', 'M02S', 'M04 4G', 'M12', 'M13', 'M23 5G', 'M32 5G', 'M33 5G'] },
      { id: 30, models: ['A15', 'A25 5G', 'A24 4G', 'M34 5G'] },
      { id: 31, models: ['A22 5G', 'A14', 'A34 5G'] },
      { id: 32, models: ['A16', 'A17', 'A26'] },
      { id: 33, models: ['A31', 'A32 4G', 'A33 5G', 'A22 4G', 'F22 4G', 'M22', 'M32 4G'] },
      { id: 34, models: ['A30', 'A50', 'A20', 'A30S', 'A50S', 'M10S', 'M30', 'M30S', 'M31'] },
      { id: 35, models: ['A20S', 'REDMI 9'] },
      { id: 36, models: ['A51', 'A52', 'A52S', 'A53', 'M31S', 'S20 FE'] },
      { id: 37, models: ['S21 FE 5G'] },
      { id: 38, models: ['A54', 'S23 FE'] },
      { id: 39, models: ['A35', 'A55', 'A35 5G'] },
      { id: 40, models: ['A36', 'A37', 'A56', 'A57', 'S24 FE', 'S25 FE', 'S26 FE'] },
      { id: 41, models: ['A21S', 'NOTE 9 PRO', 'NOTE 11 PRO', 'NOTE 12 PRO', 'NOTE 12 PRO PLUS', 'NOTE 13 4G', 'NOTE 14S', 'POCO X3', 'REDMI 11T', 'REDMI 12T', 'POCO X4 PRO', 'POCO X5', 'POCO X6', 'A71', 'A72', 'A73', 'A81', 'A91', 'M53', 'M54 5G', 'M62', 'S10 LITE', 'NOTE 10 LITE'] },
      { id: 42, models: ['NOTE 8', 'NOTE 8T'] },
      { id: 43, models: ['NOTE 8 PRO', 'POCO M3'] },
      { id: 44, models: ['NOTE 11', 'NOTE 11S', 'NOTE 12S', 'NOTE 10S', 'POCO M4 PRO', 'POCO M5S', 'REDMI 10'] },
      { id: 45, models: ['NOTE 13 5G', 'POCO X7 PRO', 'POCO X6 PRO', 'POCO F5', 'POCO F6'] },
      { id: 46, models: ['REDMI 9C', 'REDMI 9A', 'REDMI', 'POCO C3', 'POCO C31'] },
      { id: 47, models: ['REDMI 10C', 'REDMI 12C', 'POCO C40', 'POCO C61'] },
      { id: 48, models: ['REDMI 12', 'REDMI 13', 'REDMI A3', 'POCO M6 PRO', 'NOTE 12R', 'NOTE 13R'] },
      { id: 49, models: ['REDMI 13T', 'REDMI 13T PRO', 'POCO F3', 'REDMI 11X PRO'] },
      { id: 50, models: ['REDMI 14C', 'REDMI A4', 'REDMI A5', 'POCO C75', 'POCO M7'] },
      { id: 51, models: ['REDMI 15', 'POCO M7'] },
      { id: 52, models: ['REDMI 15C', 'POCO C85'] },
      { id: 53, models: ['POCO X4 GT', 'NOTE 11T PRO'] }
    ];

    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const resultsContainer = document.getElementById('results');
    const ghostText = document.getElementById('ghostText');

    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    if (isTouchDevice) {
      ghostText.style.display = 'none';
    }

    // Collect all models for autocomplete
    const allModels = [];
    for (const group of compatibilityGroups) {
      for (const model of group.models) {
        if (!allModels.includes(model)) {
          allModels.push(model);
        }
      }
    }
    allModels.sort();

    function findBestMatch(input) {
      if (!input) return null;
      const normalizedInput = normalizeText(input);
      if (!normalizedInput) return null;

      // Find models starting with input
      const starting = allModels.filter(m =>
        normalizeText(m).startsWith(normalizedInput)
      );

      if (starting.length > 0) {
        // Return longest match for continued suggestions
        return starting.reduce((a, b) => a.length >= b.length ? a : b);
      }

      // Find models containing input
      const containing = allModels.filter(m =>
        normalizeText(m).includes(normalizedInput)
      );

      if (containing.length > 0) {
        return containing.reduce((a, b) => a.length >= b.length ? a : b);
      }

      return null;
    }

    function syncGhostStyles() {
      if (isTouchDevice) return;
      const cs = window.getComputedStyle(searchInput);
      const props = ['fontSize', 'fontFamily', 'fontWeight', 'lineHeight',
        'letterSpacing', 'paddingTop', 'paddingRight', 'paddingBottom',
        'paddingLeft', 'borderTopWidth', 'borderRightWidth',
        'borderBottomWidth', 'borderLeftWidth', 'boxSizing', 'direction',
        'textAlign'];
      props.forEach(p => { ghostText.style[p] = cs[p]; });
    }

    if (!isTouchDevice) {
      syncGhostStyles();
      window.addEventListener('resize', syncGhostStyles);
      window.addEventListener('orientationchange', syncGhostStyles);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(syncGhostStyles);
      }
    }

    function updateGhostText() {
      if (isTouchDevice) return;
      const value = searchInput.value;
      if (!value) {
        ghostText.textContent = '';
        return;
      }

      const match = findBestMatch(value);
      if (match && match.toLowerCase().startsWith(value.toLowerCase()) && match.length > value.length) {
        ghostText.textContent = value + match.slice(value.length);
      } else {
        ghostText.textContent = '';
      }
    }

    function acceptGhostText() {
      if (isTouchDevice) return false;
      const value = searchInput.value;
      if (!value) return false;

      const match = findBestMatch(value);
      if (match) {
        searchInput.value = match;
        ghostText.textContent = '';
        return true;
      }
      return false;
    }

    function normalizeText(text) {
      // Convert Persian digits to English
      const persianDigits = {'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};
      let result = text.replace(/[۰-۹]/g, d => persianDigits[d] || d);

      // Apply brand aliases
      result = result
        .replace(/\bip\b/gi, 'iphone ')
        .replace(/ایفون/g, 'iphone ')
        .replace(/اپل/g, 'iphone ')
        .replace(/mi\s/gi, 'redmi ')
        .replace(/شیائومی/g, 'redmi ')
        .replace(/شیامی/g, 'redmi ')
        .replace(/xiaomi/gi, 'redmi ')
        .replace(/سامسونگ/g, 'samsung')
        .replace(/\bpoko\b/gi, 'poco')
        .replace(/پوکو/g, 'poco')
        .replace(/not\s/gi, 'note ')
        .replace(/نوت/g, 'note ');

      return result.toLowerCase().replace(/\s+/g, '');
    }

    function searchCompatibleModels(searchTerm) {
      const term = normalizeText(searchTerm);

      if (!term) {
        resultsContainer.innerHTML = `
          <div class="message-card">
            <svg class="message-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M12 16v-4"></path>
              <path d="M12 8h.01"></path>
            </svg>
            <p>لطفا مدل گوشی را وارد کنید</p>
          </div>
        `;
        return;
      }

      // Find the model and its group
      let matchedModel = null;
      let matchedGroup = null;

      for (const group of compatibilityGroups) {
        const found = group.models.find(model =>
          normalizeText(model) === term
        );
        if (found) {
          matchedModel = found;
          matchedGroup = group;
          break;
        }
      }

      if (!matchedModel) {
        resultsContainer.innerHTML = `
          <div class="message-card error">
            <svg class="message-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="m15 9-6 6"></path>
              <path d="m9 9 6 6"></path>
            </svg>
            <p>مدلی یافت نشد</p>
          </div>
        `;
        return;
      }

      // Get compatible models from the same group
      const compatibleModels = matchedGroup.models.filter(model =>
        normalizeText(model) !== normalizeText(matchedModel)
      );

      resultsContainer.innerHTML = `
        <div class="result-header">
          <h3>مشابه با <span class="highlight">${matchedModel}</span></h3>
          <p class="result-count">${compatibleModels.length} مدل مشابه</p>
        </div>
        <div class="result-card">
          <svg class="checkmark" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span class="compatible-models">${compatibleModels.join(', ')}</span>
        </div>
      `;
    }

    searchBtn.addEventListener('click', () => {
      searchCompatibleModels(searchInput.value);
    });

    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        searchCompatibleModels(searchInput.value);
      }
    });

    searchInput.addEventListener('input', updateGhostText);

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Tab' || e.key === 'ArrowRight') {
        if (ghostText.textContent) {
          e.preventDefault();
          acceptGhostText();
        }
      }
    });

    // Focus input on load
    searchInput.focus();
  </script>
</body>
</html>
